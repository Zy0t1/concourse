# CodeQL 扫描 workflow - concourse (Go)
# 默认查询套件 + SARIF 结果下载
# 说明：基于仓库原有 codeql-analysis.yml 增强，新增 SARIF 显式输出、空目录守卫与 artifact 上传
name: "CodeQL"

on:
  push:
    branches: [ master, release/* ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ master, release/* ]
  schedule:
    - cron: '24 10 * * 4'
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'go' ]
        # CodeQL supports [ 'cpp', 'csharp', 'go', 'java', 'javascript', 'python' ]
        # Learn more:
        # https://docs.github.com/en/code-security/code-scanning

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Install Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod

    # Initializes the CodeQL tools for scanning.
    # 不指定 queries -> 使用默认查询套件
    # 如需更强规则，取消注释并改为: security-extended / security-and-quality
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        # queries: security-extended

    # Go 的 autobuild = go build ./...（concourse 无 Makefile，纯 Go 项目）
    # 唯一 cgo 依赖 go-sqlite3 由 ubuntu-latest 自带 gcc 满足
    - name: Autobuild
      uses: github/codeql-action/autobuild@v4

    # 显式输出到 runner.workspace/results（避免 SARIF 落到临时目录难找）
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        output: ${{ runner.workspace }}/results

    # 空目录守卫：扫描无产出时立刻报错，杜绝"成功但没结果"的静默失败
    - name: Verify SARIF output
      shell: bash
      run: |
        if ls "${{ runner.workspace }}/results"/*.sarif >/dev/null 2>&1; then
          echo "::notice::SARIF files found:"
          ls -la "${{ runner.workspace }}/results"/*.sarif
        else
          echo "::error::No SARIF files generated under ${{ runner.workspace }}/results"
          exit 1
        fi

    # 上传 SARIF，供下载到本地分析（Actions -> Artifacts -> codeql-sarif-go.zip）
    - name: Upload SARIF artifact
      uses: actions/upload-artifact@v4
      with:
        name: codeql-sarif-${{ matrix.language }}
        path: ${{ runner.workspace }}/results/**/*.sarif
        if-no-files-found: error
